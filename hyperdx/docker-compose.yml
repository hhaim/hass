
services:
    
  hyperdx:
    image: clickhouse/clickstack-all-in-one:2.20.0
    container_name: hyperdx-stack2
    ports:
      - "8080:8080"   # HyperDX UI
      - "4317:4317"   # OTel gRPC
      - "4318:4318"   # OTel HTTP      
      - "8123:8123"   # ClickHouse HTTP (Optional)
    environment:
      # Enables v2.x JSON and Materialized View optimizations
      - BETA_CH_OTEL_JSON_SCHEMA_ENABLED=true
      - HYPERDX_APP_URL=http://frigate
      #- OTEL_AGENT_FEATURE_GATE_ARG=--feature-gates=clickhouse.json
    volumes:
      - ./store/hdx_data:/data/db
      - ./store/ch_data:/var/lib/clickhouse
    restart: unless-stopped
    # --- Resource Limits Added Below ---

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.91.0
    container_name: otel-collector
    environment:
      - HDX_INGESTION_KEY=${HDX_INGESTION_KEY}
    ports:
      - "9999:9999"   # TCP JSON from Vector (server2)
    volumes:
      - ./otel-config.yaml:/etc/otelcol-config.yaml
    command: ["--config=/etc/otelcol-config.yaml"]
    depends_on:
      - hyperdx
    restart: unless-stopped

  registry:
    image: registry:3
    container_name: local-registry
    restart: unless-stopped
    ports:
      - "5001:5000"
    environment:
      OTEL_TRACES_EXPORTER: "none"
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
    volumes:
      - ./registry:/var/lib/registry


  inventory-service:
    image: "${DNS_MONITOR_INVENTORY_IMAGE}"
    container_name: dns-monitor-inventory
    restart: unless-stopped
    depends_on:
      - hyperdx
    environment:
      CLICKHOUSE_HTTP_URL: "${CLICKHOUSE_HTTP_URL}"
      CLICKHOUSE_DATABASE: "${CLICKHOUSE_DATABASE}"
      CLICKHOUSE_USER: "${CLICKHOUSE_USER}"
      CLICKHOUSE_PASSWORD: "${CLICKHOUSE_PASSWORD}"
      CLICKHOUSE_COUNTER_TABLE: "${CLICKHOUSE_COUNTER_TABLE}"
      CLICKHOUSE_DNS_TABLE: "${CLICKHOUSE_DNS_TABLE}"
    command:
      - -http
      - 0.0.0.0:8080
      - -collector-listen
      - 0.0.0.0:19140
      - -data-dir
      - /data
      - -sqlite
      - /work/state.sqlite
      - -parsed-dns-out
      - /work/parsed-dns-live.jsonl
      - -snapshot
      - /work/inventory-snapshot.json
      - -debug-save-pcap-dir
      - ${INV_DEBUG_PCAP_DIR}
      - -skip-startup-load=${INV_SKIP_STARTUP_LOAD}
      - -disable-persistence=${INV_DISABLE_PERSISTENCE}
    ports:
      - "${INV_HTTP_BIND}:${INV_HTTP_PORT}:8080"
      - "${INV_TCP_BIND}:${INV_TCP_PORT}:19140"
    volumes:
      - "${DNS_MONITOR_WORK_DIR}:/work"
      - "${DNS_MONITOR_DATA_DIR}:/data:ro"


  ch-ui:
    depends_on:
      - hyperdx
    image: ghcr.io/caioricciuti/ch-ui:latest
    container_name: dns-monitor-ch-ui
    restart: unless-stopped
    environment:
      CLICKHOUSE_URL: "http://hyperdx:8123"
      CONNECTION_NAME: "DNS Monitor ClickHouse"
    ports:
      - "3488:3488"
    volumes:
      - ./dns-monitor/ch-ui:/app/data


  clickhouse-migrate:
    image: migrate/migrate:v4.19.1
    container_name: dns-monitor-clickhouse-migrate
    depends_on:
      - hyperdx
    profiles:
      - migrate
    command:
      - -path=/migrations 
      - -database=clickhouse://${CLICKHOUSE_NATIVE_HOST}:${CLICKHOUSE_NATIVE_PORT}?username=${CLICKHOUSE_USER}&password=${CLICKHOUSE_PASSWORD}&database=${CLICKHOUSE_MIGRATIONS_DATABASE}&x-migrations-table=${CLICKHOUSE_MIGRATIONS_TABLE}&x-migrations-table-engine=MergeTree
      - up
    volumes:
      - "${CLICKHOUSE_MIGRATIONS_DIR}:/migrations:ro"


